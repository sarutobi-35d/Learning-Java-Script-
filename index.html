<body>


    <script>

        const age = prompt("Quel est votre age ?");
        const nom = prompt("Quel est votre nom ?")

        if(age > 18){
            console.log("Nous vous recommandons Evil Man " + nom);
        } else if(age <= 18){
            console.log("Nous vous recommandons Superman " + nom);
        } else{
            console.log("Nous vous recommandons Matrix " + nom);
        }

    </script>
    
</body>
