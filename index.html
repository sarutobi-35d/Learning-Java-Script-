<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>
            
        /*
            param1(resolve) pour les promesses tenues
            param1(reject) pour les promesses non tenues
        */

        const p = new Promise((resolve, reject) =>{

            reject(4)
        })

        //then (savoir si la promesse est tenue ou pas)... capture des erreurs(catch)
        p.then((n) =>{
            console.log("Le nombre est: ", n);
        })
        .catch((e) =>{
            console.log("Erreur", e);
        })
        .finally(() =>{
            console.log("Je m'affiche toujours peu importe le résultat de la promesse.");
        })
        

    </script>
    
</body>
</html>
