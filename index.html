<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>

    const nbre = 8;

    let found;

    while(nbre != found){

        found = prompt("Votre chiffre") * 1;

        if(nbre > found){
            console.log("Dommage, le nombre est plus grand");
        } else if(nbre < found){
            console.log("Dommage, le nombre est plus petit");
        }

    }
    console.log("Felicitations");

    </script>
    
</body>
</html>
