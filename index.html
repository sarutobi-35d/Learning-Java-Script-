    <script>


        /** 
         * Permet de savoir si une personne a le droit de conduire
         * 
         * @param {number} age
         * @param {string} pays
         * @returns {boolean} 
         
        NB: A écrire dans un fichier .js
        */

        const canDrive = (age, pays)=>{

            if(age == 18 && pays == "FR" || age == 16 && pays == "USA"){
                return true
            } else{
                return false
            }
        }

        console.log(canDrive(20, "USA"));

    </script>
