<body>


    <script>
            
        const p = new Promise((resolve, reject) =>{
            resolve(4)
        });

        function wait(duration){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    resolve(duration)
                }, duration)
            })
        }

        function waitAndFaild(duration){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    reject(duration)
                }, duration)
            })
        }

        wait(2000)
        .then(()=>{
            console.log("Attendre 2s...")
            return wait(4000)
        })
        .then(() =>{
            console.log("Attendre 4s...")
        })
        

    </script>
