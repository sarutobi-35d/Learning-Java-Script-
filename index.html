<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>

        class Rectangle {

            constructor(longueur, largeur){

                if(longueur<= 0 || largeur <=0){
                    throw new Error("Impossible d'avoir une forme géometrique avec des dimensions négative.");
                }

                this.longueur = longueur;
                this.largeur = largeur;
            }

            get perimeter(){
                return (this.longueur + this.largeur) * 2;
            }

            get isValid(){
                return this.longueur > 0 && this.largeur > 0;
            }

            isBiggerThan(shape){
                return this.perimeter > shape.perimeter;
            }
        }

        class Square extends Rectangle{
            constructor(longueur){
                super(longueur, longueur);
            }
        }

        class PromptError extends Error{
        }


        function promptRectangle(){

            try {

                const longueur = prompt("L") * 1;
                const largeur = prompt("l") * 1;

                const r = new Rectangle(longueur, largeur);
               return r;
            
            } catch (e) {
                throw new PromptError("Mauvaise valeur.");
            }
        }

        try {
            promptRectangle();
        } catch (e) {

            if(e instanceof PromptError){
                console.log('PromptError');
            }else {
                console.log('Erreur classique');  
            }
        }
            
        

    </script>
    
</body>
</html>
