<!DOCTYPE html>

<body>


    <script>

        const moyenne = (notes) => {
            
            let sum = 0;

            for (let note of notes){
                sum = sum + note;
            }

            return sum / notes.length;
        }

        class Student{

            constructor(nom, prenom){
                this.nom = nom;
                this.prenom = prenom;
            }

            setNotes(notes){
                this.notes = notes;
            }

            canPass(){
                return moyenne(this.notes) >= 10;
            }

        }

        
        const jane = new Student("jane", "Doe")
        jane.setNotes([10, 19,9]);
        console.log(jane.canPass());

    </script>
    
</body>
