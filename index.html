<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>
            
        const p = new Promise((resolve, reject) =>{
            resolve(4)
        });

        function wait(duration){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    resolve(duration)
                }, duration)
            })
        }

        function waitAndFaild(duration){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    reject(duration)
                }, duration)
            })
        }



        async function main() {

            try {
                await wait(2000)
                console.log("Attends 2s")

                await wait(3000)
                console.log("Attends 3s")

                await wait(5000)
                console.log("Attends 5s")
                
            } catch (e) {
                console.log("Erreur")
            }
            
        }

        main();


        
        

    </script>
    
</body>
</html>
